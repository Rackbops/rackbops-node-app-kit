name: publish

on:
  push:
    tags:
      - "v*"

# Public npm publish. Auth is the NPM_TOKEN secret (a granular read+write token on the
# @rackbops scope, the same pattern rackbops-ui-ux-std-lib's publish.yml uses) -- Actions
# itself only needs to read the repo.
permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          scope: "@rackbops"
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # --access public: a scoped package publishes as restricted by default.
      - run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
